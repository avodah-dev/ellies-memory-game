name: Fly release
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      FLY_APP: ${{ github.ref_name == 'main' && 'matchimus' || 'matchimus-preview' }}
      FLY_CONFIG: ${{ github.ref_name == 'main' && 'fly.toml' || 'fly.preview.toml' }}
      APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run verify:release
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.99
      - name: Publish the exact image tested against emulators
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
          docker tag matchimus-verify:local "registry.fly.io/$FLY_APP:$GITHUB_SHA"
          docker push "registry.fly.io/$FLY_APP:$GITHUB_SHA"
      - name: Release to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config "$FLY_CONFIG" --image "registry.fly.io/$FLY_APP:$GITHUB_SHA" --ha=false --strategy rolling --wait-timeout 180
      - name: Verify the deployed revision
        run: |
          node --input-type=module <<'JS'
          const url=`https://${process.env.FLY_APP}.fly.dev/healthz`;
          const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw new Error(`Health check returned ${response.status}`);
          const result=await response.json();
          if(result.commit!==process.env.GITHUB_SHA || result.environment!==process.env.APP_ENV)throw new Error('Deployed revision or environment does not match');
          console.log(`Verified ${result.commit} on ${process.env.FLY_APP}`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-reports-${{ github.ref_name }}
          path: |
            coverage/
            playwright-report/
            test-results/
            *-debug.log
          retention-days: 7
