name: Fly release
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fly-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 3
    outputs:
      found: ${{ steps.verified.outputs.found }}
      tree: ${{ steps.verified.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Find successful verification for this exact tree
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/artifacts.mjs find
  suite:
    needs: prepare
    if: needs.prepare.outputs.found != 'true'
    uses: ./.github/workflows/verification-suite.yml
    with:
      commit: ${{ github.sha }}
      allow_docs_only: false
  release:
    needs: [prepare, suite]
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.found == 'true' || needs.suite.result == 'success')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      FLY_APP: ${{ github.ref_name == 'main' && 'matchimus' || 'matchimus-preview' }}
      FLY_CONFIG: ${{ github.ref_name == 'main' && 'fly.toml' || 'fly.preview.toml' }}
      APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - name: Set artifact directory
        run: echo "VERIFIED_IMAGE_DIR=$RUNNER_TEMP/verified-image" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Find an image verified for this exact tree
        if: needs.prepare.outputs.found == 'true'
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/artifacts.mjs restore
      - name: Require the retained image to remain available
        if: needs.prepare.outputs.found == 'true'
        env:
          FOUND: ${{ steps.verified.outputs.found }}
        run: test "$FOUND" = true
      - name: Download image qualified by this run's parallel suite
        if: needs.prepare.outputs.found != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-image-${{ needs.prepare.outputs.tree }}
          path: ${{ env.VERIFIED_IMAGE_DIR }}/
      - name: Validate and load the exact image qualified in this run
        if: needs.prepare.outputs.found != 'true'
        run: node scripts/ci/artifacts.mjs load
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.99
      - name: Publish the exact tested image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
          docker tag matchimus-verify:local "registry.fly.io/$FLY_APP:$GITHUB_SHA"
          docker push "registry.fly.io/$FLY_APP:$GITHUB_SHA"
      - name: Release to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config "$FLY_CONFIG" --image "registry.fly.io/$FLY_APP:$GITHUB_SHA" --ha=false --strategy rolling --wait-timeout 180
      - name: Verify deployed image revision and HTTP smoke
        run: node scripts/ci/smoke.mjs
      - name: Record promotion evidence
        env:
          SOURCE_RUN: ${{ steps.verified.outputs.source_run }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync(`${process.env.VERIFIED_IMAGE_DIR}/manifest.json`,'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Verified image promotion\n\nDeploy commit: ${process.env.GITHUB_SHA}\n\nTree: ${m.tree}\n\nImage build commit (/healthz): ${m.commit}\n\nImage ID: ${m.imageId}\n\nSource verification run: ${process.env.SOURCE_RUN || process.env.GITHUB_RUN_ID}\n`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-reports-${{ github.ref_name }}
          path: |
            ${{ env.VERIFIED_IMAGE_DIR }}/manifest.json
            coverage/
            playwright-report/
            test-results/
            *-debug.log
          retention-days: 14
