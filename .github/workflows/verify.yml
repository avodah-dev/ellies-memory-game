name: Local verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    uses: ./.github/workflows/verification-suite.yml
    with:
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      base_commit: ${{ github.event.pull_request.base.sha || '' }}
      allow_docs_only: true
  verify:
    # Preserve the exact required branch-protection status, including failure/skips.
    needs: suite
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require the complete suite
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: test "$SUITE_RESULT" = success
