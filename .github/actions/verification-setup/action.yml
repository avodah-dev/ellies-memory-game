name: Verification toolchain
description: Pinned tools and caches shared by verification and cache-miss releases
inputs:
  full:
    description: Install browser, emulator, and Docker tools for full verification
    required: true
  browsers:
    description: Install browser binaries and OS libraries
    default: 'true'
  docker:
    description: Set up the cached Docker builder
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .node-version
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.9
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.9-${{ hashFiles('bun.lock') }}
    - shell: bash
      run: bun install --frozen-lockfile
    - if: inputs.full == 'true'
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: "21"
    - if: inputs.full == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
    - if: inputs.full == 'true' && inputs.browsers == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
    - if: inputs.full == 'true' && inputs.browsers == 'true'
      shell: bash
      # Always install OS libraries; Playwright reuses exact cached browser versions.
      run: bunx playwright install --with-deps chromium webkit
    - if: inputs.full == 'true' && inputs.docker == 'true'
      uses: useblacksmith/setup-docker-builder@5fe3b77775f1dd55595beb998036fe1f2cf47118
      with:
        nofallback: true
        platforms: linux/amd64
